[project]
name = "exam-grader"
version = "0.1.0"
description = "Automated exam answer sheet recognition and grading system"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "pymupdf",
    "pandas",
    "numpy",
    "opencv-python-headless",
    "Pillow",
    "pydantic",
    "openpyxl",
    "scikit-image",
    "transformers",
    "torch",
    "xlsxwriter",
    "matplotlib",
]

[project.optional-dependencies]
openai = [
    "openai",
]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exam_grader"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
